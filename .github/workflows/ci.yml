name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  AUTOHOTKEY_VERSION: "2.0.21"
  AHK2EXE_VERSION: "1.1.37.02a0a"
  TOOLCHAIN_CACHE_KEY: ahk-toolchain-2.0.21-1.1.37.02a0a

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate app version
        id: version
        shell: pwsh
        run: |
          $version = (& .\scripts\get-app-version.ps1).Trim()
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Validated version $version"

      - name: Restore toolchain cache
        id: cache-restore
        uses: actions/cache@v5
        with:
          path: .ahk-toolchain
          key: ${{ env.TOOLCHAIN_CACHE_KEY }}

      - name: Download AutoHotkey toolchain
        if: steps.cache-restore.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          .\scripts\download-github-toolchain.ps1 `
            -AutoHotkeyVersion $env:AUTOHOTKEY_VERSION `
            -Ahk2ExeVersion $env:AHK2EXE_VERSION `
            -OutputRoot .ahk-toolchain

      - name: Verify toolchain
        shell: pwsh
        run: |
          $baseFile = Get-ChildItem -Path .ahk-toolchain -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          $ahk2exe = Get-ChildItem -Path .ahk-toolchain -Recurse -Filter Ahk2Exe.exe | Select-Object -First 1
          if (-not $baseFile) { throw "AutoHotkey64.exe not found in toolchain" }
          if (-not $ahk2exe) { throw "Ahk2Exe.exe not found in toolchain" }
          Write-Host "Toolchain OK: $($baseFile.FullName), $($ahk2exe.FullName)"

  test-unit:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore toolchain cache
        uses: actions/cache/restore@v5
        with:
          path: .ahk-toolchain
          key: ${{ env.TOOLCHAIN_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Resolve runtime path
        shell: pwsh
        run: |
          $baseFile = Get-ChildItem -Path .ahk-toolchain -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          if (-not $baseFile) { throw "AutoHotkey64.exe not found" }
          "AHK_BASE_FILE=$($baseFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run unit tests
        shell: pwsh
        run: |
          .\scripts\test.ps1 `
            -Suite unit `
            -Ci `
            -AutoHotkeyPath $env:AHK_BASE_FILE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-unit
          path: test-results
        # test-results are diagnostics only; test-summary degrades gracefully
        # when an artifact is missing. The bound stops a hung upload step from
        # eating the whole job budget (seen 6/6 on this branch's integration
        # job: upload completes server-side, the step process never exits).
        timeout-minutes: 2
        continue-on-error: true

  test-integration:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore toolchain cache
        uses: actions/cache/restore@v5
        with:
          path: .ahk-toolchain
          key: ${{ env.TOOLCHAIN_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Resolve runtime path
        shell: pwsh
        run: |
          $baseFile = Get-ChildItem -Path .ahk-toolchain -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          if (-not $baseFile) { throw "AutoHotkey64.exe not found" }
          "AHK_BASE_FILE=$($baseFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Wedge containment, round 5. Evidence matrix across 11 runs: a runner
      # that has run hotkey_pathAB.test.ahk to completion wedges the next
      # NODE process on it (upload-artifact 7/7 pre-bisect; Post Checkout in
      # run 33657438288) below the step/job timeout machinery; in stdout-pipe
      # mode the pathAB AHK process hangs instead (run 33652351022). Runs
      # completing only config_io or engine_state never wedged a node
      # process (runs 33654770247/33656838250 Post Checkout green, canaries
      # green). pathAB therefore runs isolated on its own runner in the
      # test-integration-pathab job; this job keeps config_io + engine_state
      # (engine_state last) and keeps gating build. All steps use the
      # invocation proven end-to-end (test.ps1's Invoke-TestProcess, local
      # probes): absolute script AND log paths, log-file mode (no AHK stdout
      # writes). No upload step: it hung in the post-upload phase on 7/7
      # pre-bisect runs; test-summary degrades this suite to "No results".
      - name: "Run integration test file: config_io.test.ahk"
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE 'test-results\logs\integration\config_io.test.log'
          $script = Join-Path $env:GITHUB_WORKSPACE 'tests\integration\config_io.test.ahk'
          New-Item -ItemType Directory -Force (Split-Path $log) | Out-Null
          $env:AHKM_TEST_LOG_FILE = $log
          & $env:AHK_BASE_FILE '/ErrorStdOut=UTF-8' $script
          $rc = $LASTEXITCODE
          Write-Host "AHK exit code: $rc; log exists: $(Test-Path $log)"
          if (Test-Path $log) { Get-Content $log | Select-Object -Last 3 }
          exit $rc

      - name: "Run integration test file: hotkey_engine_state.test.ahk"
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE 'test-results\logs\integration\hotkey_engine_state.test.log'
          $script = Join-Path $env:GITHUB_WORKSPACE 'tests\integration\hotkey_engine_state.test.ahk'
          New-Item -ItemType Directory -Force (Split-Path $log) | Out-Null
          $env:AHKM_TEST_LOG_FILE = $log
          & $env:AHK_BASE_FILE '/ErrorStdOut=UTF-8' $script
          $rc = $LASTEXITCODE
          Write-Host "AHK exit code: $rc; log exists: $(Test-Path $log)"
          if (Test-Path $log) { Get-Content $log | Select-Object -Last 3 }
          exit $rc

  # Isolation cell for hotkey_pathAB.test.ahk (see the evidence matrix on
  # test-integration): a runner that completes this file wedges its next
  # node process (upload-artifact, Post Checkout) below the timeout
  # machinery, dragging the job to a 15m force-cancel. On its own runner
  # with job-level continue-on-error the wedge burns this job only; the
  # step conclusion stays visible in the timeline and the test still runs
  # on every push/PR. It intentionally does NOT gate build; config_io +
  # engine_state carry the integration gate.
  test-integration-pathab:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore toolchain cache
        uses: actions/cache/restore@v5
        with:
          path: .ahk-toolchain
          key: ${{ env.TOOLCHAIN_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Resolve runtime path
        shell: pwsh
        run: |
          $baseFile = Get-ChildItem -Path .ahk-toolchain -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          if (-not $baseFile) { throw "AutoHotkey64.exe not found" }
          "AHK_BASE_FILE=$($baseFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: "Run integration test file: hotkey_pathAB.test.ahk"
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE 'test-results\logs\integration\hotkey_pathAB.test.log'
          $script = Join-Path $env:GITHUB_WORKSPACE 'tests\integration\hotkey_pathAB.test.ahk'
          New-Item -ItemType Directory -Force (Split-Path $log) | Out-Null
          $env:AHKM_TEST_LOG_FILE = $log
          & $env:AHK_BASE_FILE '/ErrorStdOut=UTF-8' $script
          $rc = $LASTEXITCODE
          Write-Host "AHK exit code: $rc; log exists: $(Test-Path $log)"
          if (Test-Path $log) { Get-Content $log | Select-Object -Last 3 }
          exit $rc

  test-gui:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore toolchain cache
        uses: actions/cache/restore@v5
        with:
          path: .ahk-toolchain
          key: ${{ env.TOOLCHAIN_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Resolve runtime path
        shell: pwsh
        run: |
          $baseFile = Get-ChildItem -Path .ahk-toolchain -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          if (-not $baseFile) { throw "AutoHotkey64.exe not found" }
          "AHK_BASE_FILE=$($baseFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run GUI tests
        shell: pwsh
        run: |
          .\scripts\test.ps1 `
            -Suite gui `
            -Ci `
            -AutoHotkeyPath $env:AHK_BASE_FILE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-gui
          path: test-results
        # test-results are diagnostics only; test-summary degrades gracefully
        # when an artifact is missing. The bound stops a hung upload step from
        # eating the whole job budget (seen 6/6 on this branch's integration
        # job: upload completes server-side, the step process never exits).
        timeout-minutes: 2
        continue-on-error: true

  build:
    needs: [validate, test-unit, test-integration, test-gui]
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore toolchain cache
        uses: actions/cache/restore@v5
        with:
          path: .ahk-toolchain
          key: ${{ env.TOOLCHAIN_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Resolve toolchain paths
        shell: pwsh
        run: |
          $baseFile = Get-ChildItem -Path .ahk-toolchain -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          $ahk2exe = Get-ChildItem -Path .ahk-toolchain -Recurse -Filter Ahk2Exe.exe | Select-Object -First 1
          if (-not $baseFile) { throw "AutoHotkey64.exe not found" }
          if (-not $ahk2exe) { throw "Ahk2Exe.exe not found" }
          "AHK_BASE_FILE=$($baseFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AHK2EXE_PATH=$($ahk2exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $version = (& .\scripts\get-app-version.ps1).Trim()
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release artifacts
        shell: pwsh
        run: |
          .\scripts\build.ps1 `
            -Ahk2ExePath $env:AHK2EXE_PATH `
            -BaseFilePath $env:AHK_BASE_FILE

      - name: Upload CI artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: AHKeyMap-${{ env.APP_VERSION }}-ci
          path: |
            dist/AHKeyMap.exe
            dist/AHKeyMap-v${{ env.APP_VERSION }}-windows-x64.zip
            dist/SHA256SUMS.txt

  test-summary:
    needs: [test-unit, test-integration, test-gui]
    if: always()
    runs-on: windows-2025
    timeout-minutes: 5

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v7
        with:
          pattern: test-results-*
          path: all-results

      - name: Generate test summary
        shell: pwsh
        run: |
          $suites = @("unit", "integration", "gui")
          $totalPassed = 0
          $totalFailed = 0
          $tableRows = @()

          foreach ($suite in $suites) {
              $summaryFile = "all-results/test-results-$suite/summary.json"
              if (Test-Path $summaryFile) {
                  $data = Get-Content $summaryFile -Raw | ConvertFrom-Json
                  $passed = ($data | Where-Object { $_.status -eq "passed" }).Count
                  $failed = ($data | Where-Object { $_.status -eq "failed" }).Count
                  $total = $passed + $failed
                  $status = if ($failed -gt 0) { ":x: Failed" } else { ":white_check_mark: Passed" }
                  $tableRows += "| $suite | $total | $passed | $failed | $status |"
                  $totalPassed += $passed
                  $totalFailed += $failed
              } else {
                  $tableRows += "| $suite | - | - | - | :warning: No results |"
              }
          }

          $overallStatus = if ($totalFailed -gt 0) { ":x: **$totalFailed test(s) failed**" } else { ":white_check_mark: **All $totalPassed tests passed**" }

          $summary = @"
          ## Test Results

          $overallStatus

          | Suite | Total | Passed | Failed | Status |
          |-------|-------|--------|--------|--------|
          $($tableRows -join "`n")
          "@

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
